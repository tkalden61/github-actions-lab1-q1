name: CI

on:
  push:  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: list files
      run: ls -ltra requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
